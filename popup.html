<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GitLab Network Catcher</title>
  <style>
    button { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; margin-left: 6px; }
    h3 { margin: 12px 0 6px; }
    h5 { margin: 8px 0 4px; }
    li {
      max-height: 260px;
      background: #f7f7f7;
      padding: 2px;
      border-radius: 6px;
      font-size: 12px;
    }
    .muted { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <div class="row">
    <div>
      <button id="copyBtn" title="Copy as Markdown">Copy</button>
      <button id="clearBtn" title="Clear all data">Clear</button>
    </div>
  </div>
  <div class="muted">Opens on any MR page. Auto-updates when new responses arrive.</div>
  <div id="output" style="margin-top:10px;">No data yet.</div>
  <script src="popup.js"></script>
</body>
</html>
