<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GitLab Network Catcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>🦊 GitLab Network Catcher</h1>
    <div class="subtitle">Capture merge request data automatically</div>
  </div>
  
  <div class="controls">
    <button id="copyBtn" class="btn primary" title="Copy as Markdown">📋 Copy</button>
    <button id="clearBtn" class="btn" title="Clear all data">🗑️ Clear</button>
  </div>
  
  <div class="content scrollbar-custom" id="output">
    <div class="empty-state">
      <div class="icon">📡</div>
      <div>No merge request data captured yet.</div>
      <div class="help-text">
        Navigate to a GitLab MR page to start capturing data.
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
